---
version: '2'
run:
  timeout: 10m
linters:
  default: all
  disable: [wsl, gomodguard]
  enable:
    - coverlint
  settings:
    custom:
      coverlint:
        type: module
        description: Enforce minimum Go test coverage.
        original-url: github.com/gostafa/coverlint
        settings:
          min: 90
          packages:
            - ./...
          timeout: 10m
          test-args:
            - -race
            - -tags=integration
    cyclop:
      max-complexity: 5
      package-average: 3
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
    depguard:
      rules:
        main:
          deny:
            - pkg: ^log$
              desc: use log/slog instead
            - pkg: ^fmt$
              desc: use fmt in development, but not in production code
    ireturn:
      allow: [anon, empty, error, generic, stdlib]
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
