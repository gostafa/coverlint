---
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions: {}
jobs:
  checks:
    uses: $/.github/workflows/checks.yml
    permissions:
      contents: write  # Allow the reusable TaskOtter job to commit updates.
      id-token: write  # Allow the reusable lint job to request OIDC tokens.
      pull-requests: write  # Allow it to open or update its synchronization PR.
