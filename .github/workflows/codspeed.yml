---
name: CodSpeed

on:
  push:
    branches:
      - main
  pull_request: null
  # Allows CodSpeed to trigger backtest performance analysis to generate initial data.
  workflow_dispatch: null

permissions:
  contents: read
  id-token: write  # for OpenID Connect authentication with CodSpeed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
      - name: Run Go benchmarks
        uses: CodSpeedHQ/action@f842b9a3ffe213dbb81768fd7f7eeb4dfcf1c369  # v5.4.2
        with:
          mode: walltime
          run: go test -run='^$' -bench=. -benchtime=3s ./...
