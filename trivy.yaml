---
# Ignore documented findings only for their specified paths.
ignorefile: .trivyignore.yaml

scan:
  # Exclude test data from all security scanners.
  skip-dirs:
    - taskotter

license:
  # Approved licenses; obligations are documented in security/README.md.
  # Trivy calls this setting "ignored"; other licenses still fail CI.
  ignored:
    - Apache-2.0
    - BlueOak-1.0.0
    - BSD-2-Clause
    - BSD-3-Clause
    - ISC
    - MIT
    - MPL-2.0
    - OFL-1.1
